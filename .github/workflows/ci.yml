name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs: clean + compile + unit tests + @WebMvcTest/@DataJpaTest slices +
      # Testcontainers integration tests (Docker is available on ubuntu-latest) +
      # Spotless check + JaCoCo coverage gates. `clean` guarantees no stale
      # bytecode from previous builds can mask or break the build.
      # `chmod +x` guards against the wrapper losing its executable bit in git
      # (Windows checkouts store 100644, which fails on Linux runners with exit 126).
      - name: Verify (clean, build, tests, spotless, coverage)
        run: chmod +x mvnw && ./mvnw -B clean verify

      - name: Validate docker compose file
        run: docker compose config --quiet
        env:
          DB_PASSWORD: ci-dummy-password
          JWT_SECRET: ci-dummy-secret-that-is-at-least-32-characters-long
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy
          S3_BUCKET_NAME: ci-dummy-bucket

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/site/jacoco/jacoco.csv
          retention-days: 7
