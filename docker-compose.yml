# One command runs the whole platform:  docker compose up --build -d
# Needs a .env file (see .env.example). All secrets come from the environment —
# nothing sensitive is baked into images (see .dockerignore).
#
# TEACHING NOTES — Kafka KRaft (no Zookeeper):
# - Kafka 3.8+ runs KRaft (Raft-based metadata quorum) in a single process with
#   KAFKA_PROCESS_ROLES=broker,controller. Zookeeper was removed because it was a
#   separate consensus system to operate, secure, and scale; KRaft keeps one system.
# - CLUSTER_ID must be a stable UUID: KRaft formats its log dir with it on first boot.
#   A random ID per start + a persisted volume = "log directory already formatted with
#   another cluster id" crash. Hence the fixed value below.
# - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 is what clients are told to use.
#   Inside this network that resolves via Docker DNS. (On bare metal it must be
#   localhost:9092 — see the smoke-test recipe in PLAN.md, local-only file.)
# - Topic auto-creation is ON (broker default): the first producer/consumer touching
#   `order-placed` creates it. Explicit topic provisioning is a Phase-11 nicety.

name: ecommerce-platform

services:
  # ------------------------------------------------------------------ databases
  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
    ports: ["5432:5432"]
    volumes: [pgdata-user:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
    ports: ["5433:5432"]
    volumes: [pgdata-product:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
    ports: ["5434:5432"]
    volumes: [pgdata-order:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ messaging
  kafka:
    image: apache/kafka:3.8.1
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: "5d8b9c2e-7a1f-4b3e-9c0d-1e2f3a4b5c6d"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # --------------------------------------------------------------- observability
  zipkin:
    image: openzipkin/zipkin:3.4.1
    ports: ["9411:9411"]

  prometheus:
    image: prom/prometheus:v3.0.1
    ports: ["9090:9090"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ------------------------------------------------------------------ platform
  service-discovery:
    build:
      context: .
      args: { SERVICE: service-discovery }
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: .
      args: { SERVICE: api-gateway }
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://service-discovery:8761/eureka
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      service-discovery: { condition: service_healthy }
      user-service: { condition: service_started }
      product-service: { condition: service_started }
      order-service: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------------ services
  # prod profile = fail-fast config: every required var is set explicitly below.
  user-service:
    build:
      context: .
      args: { SERVICE: user-service }
    ports: ["8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres-user:5432/user_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, min 32 chars (see .env.example)}
      EUREKA_URL: http://service-discovery:8761/eureka
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-user: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  product-service:
    build:
      context: .
      args: { SERVICE: product-service }
    ports: ["8082:8082"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres-product:5432/product_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, min 32 chars (see .env.example)}
      EUREKA_URL: http://service-discovery:8761/eureka
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
    depends_on:
      postgres-product: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18

  order-service:
    build:
      context: .
      args: { SERVICE: order-service }
    ports: ["8083:8083"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres-order:5432/order_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, min 32 chars (see .env.example)}
      EUREKA_URL: http://service-discovery:8761/eureka
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres-order: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  pgdata-user:
  pgdata-product:
  pgdata-order:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
