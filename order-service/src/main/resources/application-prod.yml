# Prod profile — fail-fast, env vars REQUIRED
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  jwt:
    secret: ${JWT_SECRET}
  kafka:
    topics:
      order-placed: ${ORDER_PLACED_TOPIC:order-placed}

logging:
  level:
    com.ecommerce: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
