openapi: 3.0.1
info:
  title: Product Service API
  description: "Product catalog, stock and image upload endpoints"
  contact:
    name: E-Commerce Platform
  version: 1.0.0
servers:
- url: http://localhost:8082
  description: product-service (direct)
tags:
- name: products
  description: Product catalog (ADMIN for writes)
paths:
  /api/products:
    get:
      tags:
      - products
      summary: List all products
      operationId: getAllProducts
      responses:
        "200":
          description: Product list
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - products
      summary: Create a product
      description: Requires ADMIN role
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
        required: true
      responses:
        "403":
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "201":
          description: Product created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/products/{id}/image:
    post:
      tags:
      - products
      summary: Upload a product image
      description: "Requires ADMIN role. JPEG/PNG/WebP, max 5MB"
      operationId: uploadImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "413":
          description: File too large
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
        "200":
          description: "Image uploaded, URL returned"
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
        "400":
          description: Invalid file
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
      - bearerAuth: []
  /api/products/{id}:
    get:
      tags:
      - products
      summary: Get a product by ID
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Invalid ID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "200":
          description: Product found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Product not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
components:
  schemas:
    CreateProductRequest:
      required:
      - name
      - price
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
          type: string
        description:
          maxLength: 1000
          minLength: 0
          type: string
        price:
          minimum: 0.0
          exclusiveMinimum: true
          type: number
        stockQuantity:
          minimum: 0
          type: integer
          format: int32
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stockQuantity:
          type: integer
          format: int32
        imageUrl:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
