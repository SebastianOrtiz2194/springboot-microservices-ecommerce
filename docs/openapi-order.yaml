openapi: 3.0.1
info:
  title: Order Service API
  description: Order creation and lookup endpoints
  contact:
    name: E-Commerce Platform
  version: 1.0.0
servers:
- url: http://localhost:8083
  description: order-service (direct)
tags:
- name: orders
  description: Order creation and lookup (authenticated users)
paths:
  /api/orders:
    get:
      tags:
      - orders
      summary: List the authenticated user's orders
      operationId: getUserOrders
      responses:
        "200":
          description: Order list
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - orders
      summary: Create an order for the authenticated user
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
        required: true
      responses:
        "201":
          description: "Order created, event published"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Validation failed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Order messaging unavailable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
      security:
      - bearerAuth: []
  /api/orders/{id}:
    get:
      tags:
      - orders
      summary: Get an order by ID
      operationId: getOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "400":
          description: Invalid ID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "200":
          description: Order found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
components:
  schemas:
    CreateOrderRequest:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemRequest"
    OrderItemRequest:
      required:
      - productId
      - productName
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          minimum: 1
          type: integer
          format: int32
        unitPrice:
          minimum: 0.0
          exclusiveMinimum: true
          type: number
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties:
            type: object
    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        totalAmount:
          type: number
        status:
          type: string
          enum:
          - CREATED
          - CONFIRMED
          - CANCELLED
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
